name: Build

on:
  push:
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://matt.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACTFLOW_TOKEN_FOR_CI_CD_WORKSHOP }}
  PACT_BROKER_PUBLISH_VERIFICATION_RESULTS: true
  GIT_COMMIT: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Download and install Drift
        run: |
          wget https://download.pactflow.io/quilt/latest/linux-x86_64.zip
          unzip linux-x86_64.zip
          chmod +x quilt*
          sudo mv quilt /usr/local/bin/
          quilt --version
      
      - name: Install dependencies
        run: npm i
      
      - name: Run tests
        run: GIT_BRANCH=${GITHUB_REF:11} make ci
      
      - name: Store JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: output/reports/junit/verification-result.xml
          retention-days: 30

  # Runs on branches as well, so we know the status of our PRs
  can-i-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
      - run: docker pull pactfoundation/pact-cli:latest
      - name: Can I deploy?
        run: GIT_BRANCH=${GITHUB_REF:11} make can_i_deploy

  # Only deploy from master
  deploy:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    steps:
      - uses: actions/checkout@v2
      - run: docker pull pactfoundation/pact-cli:latest
      - name: Deploy
        run: GIT_BRANCH=${GITHUB_REF:11} make deploy
        if: github.ref == 'refs/heads/master'
